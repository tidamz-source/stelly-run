function frisbee(top, rimC, outC, badge){
  const w = 28, h = 13;
  return mk(w, h, g => {
    const cx = 14, cy = 5.4, rx = 13, ry = 4, tilt = -.09;
    const rot = (x,y) => { const dx = x+.5-cx, dy = y+.5-cy; return [dx*Math.cos(tilt) + dy*Math.sin(tilt), -dx*Math.sin(tilt) + dy*Math.cos(tilt)]; };
    const E = (x,y,off,sx,sy) => { const [a,b] = rot(x,y); const u = a/(sx||rx), v = (b-(off||0))/(sy||ry); return u*u+v*v; };
    const top_ = (x,y) => E(x,y) <= 1, lip = (x,y) => E(x,y,1.7) <= 1, any = (x,y) => top_(x,y) || lip(x,y);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (!any(x,y)) continue;
      let c = top;
      if (!any(x-1,y)||!any(x+1,y)||!any(x,y-1)||!any(x,y+1)) c = outC;
      else if (!top_(x,y)) c = (!lip(x,y+1)) ? outC : rimC;
      else if (!top_(x,y+1)) c = outC;
      else { const d = E(x,y,0,rx*.8,ry*.8), b = E(x,y,.2,5,1.5);
        if (b <= 1) c = b > .45 ? badge[0] : (b < .12 ? badge[0] : badge[1]);
        else if (Math.abs(d-1) < .16) c = badge[2];
        else if (E(x,y,-1.2,rx*.55,ry*.4) <= 1 && x > cx+2) c = '#FFFFFF'; }
      g.fillStyle = c; g.fillRect(x,y,1,1); }
  });
}

const EMB_W = 240, EMB_H = 132, ER = 50, ECX = 120, ECY = 66;
function buildEmblem(){
  return mk(EMB_W, EMB_H, g => {
    // ailes
    const wing = mk(90, 90, w => {
      const feather = (cx, cy, rx, ry, a) => { const ca = Math.cos(a), sa = Math.sin(a);
        const t = (x,y,k) => { const dx = x+.5-cx, dy = y+.5-cy, u = (dx*ca + dy*sa)/(rx+k), v = (-dx*sa + dy*ca)/(ry+k); return u*u+v*v <= 1; };
        for (let y=0;y<90;y++) for (let x=0;x<90;x++){ if (!t(x,y,1)) continue; let c = C.plum; if (t(x,y,0)){ c = C.white; const dx = x+.5-cx, dy = y+.5-cy; if ((dx*ca + dy*sa) < -rx*.35 || (-dx*sa + dy*ca) > ry*.35) c = '#DCD3E8'; } w.fillStyle = c; w.fillRect(x,y,1,1); } };
      for (let j=4;j>=0;j--) feather(28 + j*11, 60 - j*6 + j*j*.6, 16 - j, 5, -.55 + j*.1);
      for (let j=3;j>=0;j--) feather(22 + j*10, 44 - j*8 + j*j, 15 - j, 5, -.9 + j*.12);
      for (let j=3;j>=0;j--) feather(16 + j*8, 32 - j*7 + j*j, 11 - j, 4.5, -1.1 + j*.1);
    });
    g.drawImage(wing, ECX + ER - 18, ECY - 58);
    g.save(); g.scale(-1, 1); g.drawImage(wing, -(ECX - ER + 18), ECY - 58); g.restore();
    // anneau + fond
    for (let y=0;y<EMB_H;y++) for (let x=0;x<EMB_W;x++){ const dx = x+.5-ECX, dy = y+.5-ECY, d = Math.hypot(dx, dy); if (d > ER+1) continue;
      let c;
      if (d > ER) c = C.plum;
      else if (d > ER-8){ c = C.yellow; if (d > ER-1 || d < ER-7) c = C.plum; else if (dx - dy < -ER*.55) c = C.orange; else if (dx - dy > ER*.8) c = C.yellowL; }
      else { const k = d / (ER-8); c = k < .45 ? '#8E6CC0' : (k < .75 ? ((x+y)%2 ? C.purple : '#8E6CC0') : (k < .88 ? C.purple : ((x+y)%2 ? C.purpleD : C.purple)));
        if (Math.abs(dy - 18) < .6 && Math.abs(dx) < ER-12) c = C.purpleL; if (Math.abs(d - 18) < .6 && dy < 18) c = C.purpleL; }
      g.fillStyle = c; g.fillRect(x,y,1,1); }
    for (let i=0;i<8;i++){ const a = i*Math.PI/4 + Math.PI/8, sx = Math.round(ECX + Math.cos(a)*(ER-4)), sy = Math.round(ECY + Math.sin(a)*(ER-4));
      pm(g, ['..o..','.oyo.','oyyyo','.oyo.','..o..'].map(r => r), sx-2, sy-2, false, Object.assign({}, PAL, { y:C.white })); }
    // étoiles scintillantes dans le blason
    g.fillStyle = C.white; [[-26,-24],[28,-20],[-32,4],[34,6],[-14,-34],[10,-36]].forEach(([a,b]) => { g.fillRect(ECX+a, ECY+b, 1, 1); g.fillRect(ECX+a-1, ECY+b, 3, 1); g.fillRect(ECX+a, ECY+b-1, 1, 3); });
  });
}
const RIB_W = 250, RIB_H = 30;
function buildRibbon(){
  return mk(RIB_W, RIB_H, g => {
    // queues repliées
    for (const side of [0, 1]){ const x0 = side ? RIB_W - 30 : 0;
      g.fillStyle = C.plum; g.fillRect(x0, 9, 30, 21); g.fillStyle = '#5A2E7A'; g.fillRect(x0+1, 10, 28, 19);
      g.fillStyle = C.plum; for (let k=0;k<9;k++){ const xx = side ? x0 + 29 - k : x0 + k; g.fillRect(xx, 19 - k, 1, 2*k+1 > 19 ? 19 : 1); }
      g.fillStyle = C.plum; for (let k=0;k<10;k++){ const xx = side ? x0 + 29 - k : x0 + k; g.fillRect(xx, 10 + k, 1, 1); g.fillRect(xx, 28 - k, 1, 1); }
      g.fillStyle = C.purpleD; const fx = side ? RIB_W - 34 : 24; g.fillRect(fx, 24, 10, 6);
      pm(g, ['..o..','.oyo.','oyyyo','.oyo.','o.o.o'], side ? RIB_W - 20 : 13, 13);
    }
    g.fillStyle = C.plum; g.fillRect(20, 0, RIB_W - 40, 26);
    g.fillStyle = C.purple; g.fillRect(21, 1, RIB_W - 42, 24);
    g.fillStyle = C.yellow; g.fillRect(21, 2, RIB_W - 42, 2); g.fillRect(21, 21, RIB_W - 42, 2);
    g.fillStyle = C.purpleL; g.fillRect(21, 5, RIB_W - 42, 1); g.fillStyle = C.purpleD; g.fillRect(21, 19, RIB_W - 42, 2);
    g.fillStyle = C.white; g.fillRect(21, 1, RIB_W - 42, 1); g.fillRect(21, 24, RIB_W - 42, 1);
    for (const sx of [28, RIB_W - 33]) pm(g, ['..o..','.oyo.','oyyyo','.oyo.','..o..'], sx, 10, false, Object.assign({}, PAL, { y:C.white }));
  });
}

function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)();
    sfxBus = actx.createGain(); sfxBus.gain.value = sfxOn ? 1 : 0; sfxBus.connect(actx.destination);
    musBus = actx.createGain(); musBus.gain.value = musicOn ? .6 : 0; musBus.connect(actx.destination);
    if (state === 'title') MUSIC.play('title'); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f1, f2, dur, type, vol, delay){
  if (!sfxOn || !actx) return; const t0 = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type||'square';
  o.frequency.setValueAtTime(f1, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(vol||.05, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g).connect(sfxBus); o.start(t0); o.stop(t0+dur+.02);
}

function update(dt){
  clock += dt;
  if (state === 'title') titleT += dt;
  if (state === 'play'){
    t += dt; { const target = 235 * Math.pow(1.10, Math.floor(t/5)); speed = speed < target ? Math.min(target, speed + target*.25*dt) : target; }
    boost = lerp(boost, fireT > 0 ? 1.6 : 1, Math.min(1, dt*4));
    spEff = speed * boost; sockIn -= dt; if (t > 13) fireIn -= dt;
  } else if (state === 'over'){ spEff *= Math.pow(.004, dt); overT += dt; }
  else if (state === 'title'){ spEff = 30; }

  const dx = spEff*dt; bgX += dx;
  if (state !== 'title'){
    if (state === 'play') dist += dx;
    for (const o of obs){ o.x -= dx; if (o.leapT !== undefined) o.leapT += dt; } for (const o of discs) o.x -= dx; for (const o of items) o.x -= dx;
    obs = obs.filter(o => o.x + o.w > -30); for (const o of discs) if (!o.got && !o.missed && o.x < P.x - 20 && state === 'play'){ o.missed = true; streak = 0; }
    discs = discs.filter(o => o.x > -30 && !o.got); items = items.filter(o => o.x > -30 && !o.got);
  }

  if (state === 'play' && t > 3){ flyIn -= dt; if (flyIn <= 0) spawnFlyer(); }
  if (state !== 'title'){
    for (const f of flyers){ f.t += dt; f.x -= Math.max(spEff, 60)*f.k*dt; }
    flyers = flyers.filter(f => f.x > -50 && !f.gone);
  }
  if (state === 'play'){
    nextObs -= dx; if (nextObs <= 0) spawnObstacle();
    P.buf -= dt; P.land -= dt;
    if (P.buf > 0 && P.ground){
      P.vy = -(P.sockT > 0 ? 460 : 330); P.ground = false; P.buf = 0; sfx.jump(); dust(P.x-2, GY-1, 6);
      if (P.sockT > 0) burst(P.x-8, P.y-4, 8, [C.white, '#E6DCF0'], 60, 80);
    }
    { const tg = fireT > 0 ? 1.3 : 1; MUSIC.tempo += (tg - MUSIC.tempo) * Math.min(1, dt*(tg > MUSIC.tempo ? 4 : 1.5)); MUSIC.fire = fireT > 0; }
    P.sockT = Math.max(0, P.sockT - dt); graceT = Math.max(0, graceT - dt); { const had = fireT > 0; fireT = Math.max(0, fireT - dt); if (had && fireT <= 0) graceT = 1; }
    P.anim += dt * (10 + spEff/17);
    if (P.ground && P.land <= 0){ P.dust -= dt; if (P.dust <= 0){ dust(P.x-5, GY-1, 1); P.dust = .08; } }
    if (fireT > 0){ flame(P.x-4, P.y-28, 3, 34); if (Math.random() < dt*40) lines.push({ x: W + Math.random()*30, y: 8 + Math.random()*(GY+10), len: 10 + Math.random()*26 }); }
  }
  if (state === 'play' || state === 'over'){
    if (P.sink){ P.y = Math.min(GY + FB + 4, P.y + 70*dt); }
    else if (!P.ground){
      const g = P.vy < 0 ? (P.hold && state === 'play' ? 1000 : 2400) : 1600;
      P.vy += g*dt; P.y += P.vy*dt;
      if (P.y >= GY){ P.y = GY; P.vy = 0; P.ground = true; if (state === 'play'){ P.land = .09; dust(P.x, GY-1, 5); } }
    }
  }

  if (state === 'play'){
    for (const o of obs){
      if (o.smashed) continue;
      if (o.k === 'hole'){
        if (P.ground && fireT <= 0 && graceT <= 0 && P.x > o.x + 6 && P.x < o.x + o.w - 6){
          if (o.th === 1) die('slip');
          else if (o.mode === 'peek') die(o.th === 2 ? 'crab' : (o.th === 3 ? 'marmot' : 'mole'));
          else { P.x = Math.round(o.x + o.w/2); die(o.th === 4 ? 'sewer' : 'hole'); }
          break;
        }
        continue;
      }
      for (const [x0, x1, top] of hitboxes(o)){
        if (P.x+6 > x0 && P.x-6 < x1 && P.y > top){ if (fireT > 0 || graceT > 0){ o.smashed = true; smash(o); } else die(o.th === 5 ? 'stump' : (o.th === 6 ? 'bale' : 'hit')); break; }
      }
      if (state !== 'play') break;
    }
    obs = obs.filter(o => !o.smashed);
    for (const f of flyers){
      const S = FLY_SPECS[f.sp], fy = flyerY(f);
      if (Math.abs(f.x - P.x) < S.hw + 7 && fy + S.hh > P.y - 46 && fy - S.hh < P.y - 2){
        if (fireT > 0 || graceT > 0){ f.gone = true; debris.push({ img: f.sp === 'shuttle' ? SHUTTLE : FLY_FR[f.sp][1], x: f.x - S.w/2, y: fy - S.h/2, vx: 220, vy: -260, rot: 0, vr: 14 }); sfx.smash(); }
        else { die(f.sp); break; }
      }
    }
  }
  if (state === 'play'){
    for (const o of discs){
      if (fireT > 0 && o.x - P.x < 220 && o.x - P.x > -40){ const k = Math.min(1, dt*9); o.x += (P.x - o.x)*k; o.y += (P.y - 28 - o.y)*k; }

    for (const s of items){
      if (s.k === 'sock' && Math.abs(s.x+9 - P.x) < 17 && s.y+14 > P.y-56 && s.y+6 < P.y+2){
        s.got = true; P.sockT = 7; sfx.sock(); toast('Super saut !'); burst(s.x+9, s.y+12, 16, [C.purpleL, C.white, C.purple], 85, 100);
      }
      if (s.k === 'fire'){ if (Math.random() < .35) flame(s.x, s.y-6, 1, 16, ['#FFE34A', '#F6C65C', '#E9A21C', C.white]);
        if (Math.abs(s.x - P.x) < 18 && s.y > P.y-58 && s.y < P.y+2){ s.got = true; fireT = 7; sfx.fire(); toast('Invincible !'); flash = .1; flame(P.x, P.y-28, 30, 40); } }
    }

    if (score >= milestone){ milestone += 500; sfx.mile(); ui.score.classList.add('pulse'); setTimeout(() => ui.score.classList.remove('pulse'), 220); }
    if (score !== shownScore){ ui.score.textContent = pad(score); shownScore = score; }
    let nt = theme; zoneT -= dt;
    if (zoneT <= 0){ zoneT = 12 + Math.random()*6; do { nt = Math.floor(Math.random()*THEME_NAMES.length); } while (nt === theme); }
    if (nt !== theme){ prevTheme = theme; theme = nt; setZone(nt); transT = .8; flash = .25; sfx.world(); }
    ui.sockbar.hidden = P.sockT <= 0; if (P.sockT > 0) ui.sockfill.style.transform = 'scaleX(' + (P.sockT/7).toFixed(3) + ')';

  if (state === 'over' && overT > .65 && ui.over.hidden){
    ui.final.textContent = pad(score);
    ui.bestline.textContent = P.newBest ? 'Nouveau record !' : 'Record ' + pad(best);
    ui.bestline.className = 'line' + (P.newBest ? ' new' : '');
    ui.hi.textContent = 'Record ' + pad(best);
    ui.sockbar.hidden = true; ui.firebar.hidden = true; ui.over.hidden = false;

  }

  // requin (plage)
  if (theme === 2 && state !== 'title'){
    if (!shark){ sharkIn -= dt; if (sharkIn <= 0){ shark = { x: W*(.3 + Math.random()*.55), t:0 }; sharkIn = 6 + Math.random()*7; } }

  confetti = confetti.filter(c => c.y < H + 4 && state === 'title');
  for (const d of debris){ d.vy += 900*dt; d.x += d.vx*dt - dx; d.y += d.vy*dt; d.rot += d.vr*dt; }

  for (const l of lines) l.x -= dx*2.2; lines = lines.filter(l => l.x + l.len > 0);

  for (const p of pops){ p.t += dt; p.x -= dx*.4; }
  pops = pops.filter(p => p.t < .8);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
}

let RAYS = null, raysStep = -1;

const LET = { L:['100','100','100','100','111'], U:['101','101','101','101','111'], T:['111','010','010','010','010'], E:['111','100','110','100','111'],
  C:['111','100','100','100','111'], F:['111','100','110','100','100'], Y:['101','101','010','010','010'], P:['110','101','110','100','100'],
  R:['110','101','110','101','101'], I:['111','010','010','010','111'], D:['110','101','101','101','110'],
  M:['101','111','111','101','101'], A:['010','101','111','101','101'] };
function word(g, s, cx, y, col){ const w = s.length*4-1; let x = Math.round(cx - w/2); g.fillStyle = col;
  for (const ch of s){ const m = LET[ch]; for (let j=0;j<5;j++) for (let i=0;i<3;i++) if (m[j][i]==='1') g.fillRect(x+i, y+j, 1, 1); x += 4; } }

function disk(g, cx, cy, R, fn){ for (let y=0;y<32;y++) for (let x=0;x<32;x++){ const d = Math.hypot(x+.5-cx, y+.5-cy); if (d <= R){ const c = fn(d, x, y); if (c){ g.fillStyle = c; g.fillRect(x,y,1,1); } } } }

    if (P.sink) ctx.restore();
  }

  for (const p of parts){ ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  for (const p of pops){ if (p.t > .6 && Math.floor(p.t*20)%2) continue; ptext(p.s, p.x, p.y - p.t*22, p.col); }
  if (flash > 0){ ctx.globalAlpha = Math.min(1, flash/.12)*.7; ctx.fillStyle = C.white; ctx.fillRect(-4,-4,W+8,H+8); ctx.globalAlpha = 1; }
  ctx.restore();
}

/* ================= Boucle ================= */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts; let dt = (ts - last)/1000; last = ts; if (dt > .05) dt = .05;
  if (state !== 'pause'){ const n = Math.min(6, Math.max(1, Math.ceil(dt/.006))); for (let i=0;i<n;i++) update(dt/n); }
  draw();
}

/* ================= Responsive ================= */
function resize(){
  const vw = wrap.parentElement.clientWidth, vh = wrap.parentElement.clientHeight, a = vw/vh;
  wide = a >= 1.5;
  if (wide){ H = 200; W = Math.max(300, Math.min(460, Math.round(200*a))); GY = H - 36; }
  else { W = 300; H = Math.max(200, Math.min(640, Math.round(300/a))); GY = a >= 1 ? H - 36 : H - Math.max(36, Math.round(H*.42)); }
  FT = GY - 26;
  lay.ey = wide ? 86 : Math.round(Math.max(90, GY*.46));
  lay.ry = lay.ey + 40; lay.by = lay.ry + 21; lay.ly = wide ? GY + 7 : lay.by + 30; lay.py = wide ? 3 : Math.max(4, lay.ey - 104);
  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  const s = Math.min(vw/W, vh/H);
  wrap.style.width = Math.floor(W*s) + 'px'; wrap.style.height = Math.floor(H*s) + 'px';
  const rs = document.documentElement.style;
  rs.setProperty('--s', s.toFixed(3)); rs.setProperty('--gy', GY);
  rs.setProperty('--py', lay.py); rs.setProperty('--ry', lay.ry); rs.setProperty('--by', lay.by); rs.setProperty('--ly', lay.ly);
  buildThemes(); RAYS = null;
  if (state === 'title' || P.ground) P.y = GY;
  obs.length = 0; discs.length = 0; items.length = 0;
}

/* ================= Icônes ================= */
function icon(id, img){ const c = $(id); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); }
icon('icoDisc', DISC); icon('icoCount', DISC); icon('icoSock', SOCK[0]); icon('icoCone', CONES[0]);
icon('icoFire', BOTTLE);

/* ================= Contrôles ================= */
function press(){
  ensureAudio();
  if (state === 'title'){ startGame(); return; }
  if (state === 'over'){ if (overT > .7) startGame(); return; }
  if (state === 'pause'){ resume(); return; }
  P.hold = true; P.buf = .13;
}
function release(){ P.hold = false; }
function pause(){ if (state !== 'play') return; MUSIC.pause(); state = 'pause'; ui.pause.hidden = false; $('pausebtn').hidden = true; P.hold = false; }
function resume(){ MUSIC.resume(); state = 'play'; ui.pause.hidden = true; $('pausebtn').hidden = false; last = 0; }
let zoneTimer = 0;
function setZone(n){ const z = $('zone'); z.textContent = THEME_NAMES[n]; z.hidden = false; z.classList.toggle('ice', n === 3); z.classList.remove('pop'); void z.offsetWidth; z.classList.add('pop'); clearTimeout(zoneTimer); zoneTimer = setTimeout(() => { z.hidden = true; }, 3000); }
$('pausebtn').addEventListener('click', e => { e.stopPropagation(); pause(); });

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'Escape' || e.code === 'KeyP'){ state === 'pause' ? resume() : pause(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });
wrap.addEventListener('pointerdown', e => { if (e.target.closest('button') || e.target.closest('#soundmenu')) return; if (!smenu.hidden){ smenu.hidden = true; return; } e.preventDefault(); press(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);
$('start').addEventListener('click', e => { e.stopPropagation(); startGame(); });
$('again').addEventListener('click', e => { e.stopPropagation(); startGame(); });
$('home').addEventListener('click', e => { e.stopPropagation(); goHome(); });
$('resume').addEventListener('click', e => { e.stopPropagation(); resume(); });
const smenu = $('soundmenu');
function refreshSound(){
  $('tgMusic').setAttribute('aria-pressed', musicOn); $('tgSfx').setAttribute('aria-pressed', sfxOn);
  ui.mute.textContent = (musicOn || sfxOn) ? 'Son' : 'Muet';
  if (musBus) musBus.gain.setTargetAtTime(musicOn ? .6 : 0, actx.currentTime, .05);
  if (sfxBus) sfxBus.gain.setTargetAtTime(sfxOn ? 1 : 0, actx.currentTime, .02);
  try { localStorage.setItem('stellyrun_music', musicOn ? '1' : '0'); localStorage.setItem('stellyrun_sfx', sfxOn ? '1' : '0'); } catch(e){}
}
ui.mute.addEventListener('click', e => { e.stopPropagation(); ensureAudio(); smenu.hidden = !smenu.hidden; if (!smenu.hidden) pause(); ui.mute.blur(); });
$('tgMusic').addEventListener('click', e => { e.stopPropagation(); ensureAudio(); musicOn = !musicOn; refreshSound(); });
$('tgSfx').addEventListener('click', e => { e.stopPropagation(); ensureAudio(); sfxOn = !sfxOn; refreshSound(); });
refreshSound(); showTitleRecord(); $('ver').textContent = 'v' + APP_VERSION;
document.addEventListener('visibilitychange', () => { if (document.hidden){ pause(); if (actx) actx.suspend(); } else if (actx) actx.resume(); });
addEventListener('blur', pause);
addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);

})();
</script>
<script>
/* ================= PWA ================= */
(() => {
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const btn = document.getElementById('install');
  const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone) btn.hidden = false; });
  addEventListener('appinstalled', () => { btn.hidden = true; deferred = null; });
  if (ios && !standalone) btn.hidden = false;
  btn.addEventListener('click', async e => {
    e.stopPropagation();
    if (deferred){ deferred.prompt(); try { await deferred.userChoice; } catch(_){} deferred = null; btn.hidden = true; }
    else if (ios){ const t = document.getElementById('toast'); t.textContent = 'Partager puis « Sur l’écran d’accueil »'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
  });
  // en portrait sur téléphone : pause automatique
  const mq = matchMedia('(orientation: portrait) and (pointer: coarse)');
  const onOri = () => { if (mq.matches) dispatchEvent(new Event('blur')); };
  (mq.addEventListener ? mq.addEventListener('change', onOri) : mq.addListener(onOri));
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch(_){}
})();
</script>

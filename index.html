function frisbee(top, rimC, outC, badge){
  const w = 28, h = 13;
  return mk(w, h, g => {
    const cx = 14, cy = 5.4, rx = 13, ry = 4, tilt = -.09;
    const rot = (x,y) => { const dx = x+.5-cx, dy = y+.5-cy; return [dx*Math.cos(tilt) + dy*Math.sin(tilt), -dx*Math.sin(tilt) + dy*Math.cos(tilt)]; };
    const E = (x,y,off,sx,sy) => { const [a,b] = rot(x,y); const u = a/(sx||rx), v = (b-(off||0))/(sy||ry); return u*u+v*v; };
    const top_ = (x,y) => E(x,y) <= 1, lip = (x,y) => E(x,y,1.7) <= 1, any = (x,y) => top_(x,y) || lip(x,y);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){ if (!any(x,y)) continue;
      let c = top;
      if (!any(x-1,y)||!any(x+1,y)||!any(x,y-1)||!any(x,y+1)) c = outC;
      else if (!top_(x,y)) c = (!lip(x,y+1)) ? outC : rimC;
      else if (!top_(x,y+1)) c = outC;
      else { const d = E(x,y,0,rx*.8,ry*.8), b = E(x,y,.2,5,1.5);
        if (b <= 1) c = b > .45 ? badge[0] : (b < .12 ? badge[0] : badge[1]);
        else if (Math.abs(d-1) < .16) c = badge[2];
        else if (E(x,y,-1.2,rx*.55,ry*.4) <= 1 && x > cx+2) c = '#FFFFFF'; }
      g.fillStyle = c; g.fillRect(x,y,1,1); }
  });
}

      let c;

  return mk(EMB_W, EMB_H, g => {

    const wing = mk(90, 90, w => {

    drawClouds('#DCE7F3');
    tile(T.far, bgX*.08, FT - 110);
    tile(T.mid, bgX*.3, FT - 64); drawLift();
  }
  tile(T.field, bgX*.55, FT);
  tile(T.ground, bgX, GY - 3);
  if (H - GY > 60) tile(T.fg, bgX, GY + Math.round((H-GY)*.8) - 26);
  if (th === 3) drawFlakes();
}
function drawHole(o){
  const x = Math.round(o.x), w = o.w, cx = x + w/2;
  if (o.th === 1){
    ell(cx, GY + 2, w/2 + 3, 4.2, (u, v, d) => d > .82 ? C.plum : (d > .62 ? '#1A4F9E' : (v < -.3 ? '#8FD3FF' : '#2A8BE0')));
    const k = Math.floor(clock*5 + o.ph) % 4;
    ctx.fillStyle = C.white; ctx.fillRect(Math.round(cx - w/4) + k, GY + 1, 4, 1); ctx.fillRect(Math.round(cx + w/6) - k, GY + 3, 3, 1);
    ctx.fillStyle = '#BFE8FF'; ctx.fillRect(Math.round(cx - 2), GY + 2, 5, 1); ctx.fillRect(Math.round(x + 3), GY + 3, 2, 1);
    return;
  }
  if (o.th === 3){
    for (let i=0;i<w;i++){ const y1 = GY - 1 - Math.round(i*2/w), y2 = GY - 3 + Math.round(i*3/w);
      ctx.fillStyle = C.plum; ctx.fillRect(x+i, y1-1, 1, 3); ctx.fillRect(x+i, y2-1, 1, 3);
      ctx.fillStyle = C.purple; ctx.fillRect(x+i, y1, 1, 1); ctx.fillStyle = C.red; ctx.fillRect(x+i, y2, 1, 1); }
    ctx.fillStyle = C.plum; ctx.fillRect(x+w, GY-5, 2, 2); ctx.fillRect(x+w-1, GY-1, 2, 2);
    const pole = (x0, y0, x1, y1) => { const n = Math.max(Math.abs(x1-x0), 1); for (let i=0;i<=n;i++){ ctx.fillStyle = '#9DA3A8'; ctx.fillRect(Math.round(lerp(x0,x1,i/n)), Math.round(lerp(y0,y1,i/n)), 1, 1); }
      ctx.fillStyle = C.plum; ctx.fillRect(x1-1, y1-1, 3, 1); ctx.fillRect(x1-1, y1+1, 3, 1); ctx.fillRect(x1-1, y1, 1, 1); ctx.fillRect(x1+1, y1, 1, 1); ctx.fillRect(x0-1, y0-1, 2, 2); };
    pole(x + 3, GY - 6, x + w - 5, GY); pole(x + w - 3, GY - 7, x + 6, GY - 1);
    return;
  }
  if (o.th === 0){
    ell(x + w + 4, GY - 1, 9, 5.5, (u, v, d, px, py) => py > 0 ? null : (d > .75 ? C.plum : (u - v > .5 ? '#A8743F' : '#8A5A2B')));
    ctx.fillStyle = '#6B4424'; ctx.fillRect(x + w + 1, GY - 4, 1, 1); ctx.fillRect(x + w + 7, GY - 3, 1, 1);
  } else {
    ell(x - 3, GY, 6, 3.5, (u,v,d,px,py) => py > 0 ? null : (d > .75 ? C.sandD : C.sand2));
    ell(x + w + 3, GY, 6, 3.5, (u,v,d,px,py) => py > 0 ? null : (d > .75 ? C.sandD : C.sand2));
  }
  const rim = o.th === 0 ? '#6B4424' : C.sandD, deep = o.th === 0 ? '#2A1A0E' : '#6B4F22', mid2 = o.th === 0 ? '#4A2E18' : '#8A6A30';
  ell(cx, GY + 2, w/2, 4.5, (u, v, d) => d > .72 ? rim : (v > .1 ? deep : mid2));
  if (o.th === 2 && Math.sin(clock*1.9 + o.ph) > .45){
    const up = Math.sin(clock*1.9 + o.ph) > .7 ? 0 : 1;
    pm(ctx, ['...ow...wo...','...ok...ko...','oo..o...o..oo','oroooooooooro','.orrrrrrrrro.','..orrrrrrro..'], cx - 6, GY - 5 + up, false, Object.assign({}, PAL, { r:C.red, w:C.white, k:C.plum }));
  }
  if (o.th === 0 && Math.sin(clock*1.7 + o.ph) > .55){
    pm(ctx, ['.oooo.','owkkwo','oggggo','ogrrgo'], cx - 3, GY - 3, false, Object.assign({}, PAL, { g:'#6B6470', k:C.plum, w:C.white, r:C.tongue }));
  }
}

const TMP = mk(SW, SH), tctx = TMP.getContext('2d');
function tinted(spr, col){ tctx.globalCompositeOperation = 'source-over'; tctx.clearRect(0,0,SW,SH); tctx.drawImage(spr, 0, 0); tctx.globalCompositeOperation = 'source-atop'; tctx.fillStyle = col; tctx.fillRect(0,0,SW,SH); tctx.globalCompositeOperation = 'source-over'; return TMP; }

function draw(){
  ctx.save();
  if (shake > 0 && !reduced) ctx.translate(Math.round(Math.random()*4-2), Math.round(Math.random()*4-2));
  else if (fireT > 0 && state === 'play' && !reduced) ctx.translate(0, Math.round(Math.random()*2-1));

  if (state === 'title'){
    drawBack(0);
    const ex = Math.round(W/2), ey = lay.ey;
    const off = Math.round((1 - easeBack(clamp01(titleT/.55))) * (H*.7));
    ctx.drawImage(EMBLEM, ex - ECX, ey - ECY + off);
    if (titleT > .5){
      const soff = Math.round((1 - easeBack(clamp01((titleT - .5)/.4))) * 80);
      const blink = (clock % 3.2) > 3.05, f = blink ? 2 : (Math.floor(clock*2.5) % 2);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, lay.ry - 4 + off); ctx.clip();
      ctx.drawImage(HERO[f], ex - SW, ey - 70 + soff + off, SW*2, (SH+14)*2);
      ctx.restore();
      // frisbee lancé depuis la droite, attrapé du bout des doigts puis tenu en pince
      const hx = ex - SW + (SHR[0] + 4)*2, hy = ey - 70 + soff + off + (SHR[1] - 15 + 14 + (f === 1 ? 1 : 0))*2;
      const tx = hx - 1, ty = hy - 18, T0f = 1.0, T1f = 1.65, TILT = -.12;
      const discAt = (x, y, rot) => { ctx.save(); ctx.translate(Math.round(x), Math.round(y + 13)); ctx.rotate(rot); ctx.drawImage(DISC, 0, 0, 28, 13, 0, -13, 56, 26); ctx.restore(); };
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, lay.ry - 4 + off); ctx.clip();
      if (titleT >= T1f){
        if (!titleCaught){ titleCaught = true; burst(tx + 10, ty + 10, 14, [C.yellow, C.white, C.disc], 80, 120); }
        discAt(tx, ty, TILT);
        ctx.drawImage(PINCH, 0, 0, 8, 7, hx - 4, hy - 12, 16, 14);
      } else {
        ctx.drawImage(OPENH, 0, 0, 10, 7, hx - 6, hy - 10, 20, 14);
        if (titleT > T0f){
          const k = (titleT - T0f)/(T1f - T0f), e = 1 - Math.pow(1-k, 2), sx = W + 40, sy = ey - 100;
          const x = lerp(sx, tx, e), y = lerp(sy, ty, e) - 34*Math.sin(Math.PI*e);
          discAt(x, y, TILT + Math.sin(clock*18)*.1 - .2*(1-e));
          ctx.globalAlpha = .5; ctx.fillStyle = C.white; for (let i=1;i<4;i++) ctx.fillRect(Math.round(x + 56 + i*8), Math.round(y + 10 + i), 5, 1); ctx.globalAlpha = 1;
        }
      }
      ctx.restore();
    }
    ctx.drawImage(RIBBON, ex - RIB_W/2, lay.ry - 13 + off);
    for (const c of confetti){ ctx.fillStyle = c.col; const flip = Math.floor(c.t*8 + c.ph) % 2; ctx.fillRect(Math.round(c.x), Math.round(c.y), flip ? 2 : 1, flip ? 1 : 2); }
  } else {
    if (transT > 0){ drawBack(prevTheme); ctx.globalAlpha = 1 - transT/.8; drawBack(theme); ctx.globalAlpha = 1; } else drawBack(theme);

    for (const l of lines){ ctx.globalAlpha = .7; ctx.fillStyle = C.white; ctx.fillRect(Math.round(l.x), Math.round(l.y), Math.round(l.len), 1); ctx.globalAlpha = 1; }
    for (const o of obs){ if (o.k === 'hole') drawHole(o); else for (const [img, x, y] of pieces(o)) ctx.drawImage(img, Math.round(x), y); }
    for (const s of items){
      if (s.k === 'sock'){ const f = Math.floor(clock*8)%2; ctx.drawImage(SOCK[f], Math.round(s.x), Math.round(s.y + Math.sin(clock*4)*3)); }
      else { const by = Math.round(s.y + Math.sin(clock*4)*2); ctx.drawImage(FLAMES[Math.floor(clock*12)%3], Math.round(s.x) - 13, by - 19); ctx.drawImage(FDISC, Math.round(s.x) - 14, by - 5); }
    }
    for (const o of discs) ctx.drawImage(DISC, Math.round(o.x - 14), Math.round(o.y - 5));
    for (const d of debris){ ctx.save(); ctx.translate(Math.round(d.x + d.img.width/2), Math.round(d.y + d.img.height/2)); ctx.rotate(d.rot); ctx.drawImage(d.img, -Math.round(d.img.width/2), -Math.round(d.img.height/2)); ctx.restore(); }

    if (!P.sink){ const hgt = GY - P.y, sw = Math.max(6, Math.round(22 - hgt*.14)); ctx.globalAlpha = .3; ctx.fillStyle = C.plum; ctx.fillRect(Math.round(P.x - sw/2), GY+1, sw, 2); ctx.globalAlpha = 1; }

    const px = Math.round(P.x - CX), py = Math.round(P.y - FB);
    let spr;
    if (state === 'over') spr = DEAD;
    else if (!P.ground) spr = P.vy < -120 ? RISE : (P.vy < 120 ? APEX : FALL);
    else if (P.land > 0) spr = LAND;
    else spr = RUN[Math.floor(P.anim) % RUN_N];
    if (P.sink){ ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GY + 3); ctx.clip(); }
    if (fireT > 0 && state === 'play'){
      const col = Math.floor(clock*14) % 2 ? 'rgba(122,87,160,.7)' : 'rgba(255,255,255,.75)';
      ctx.globalAlpha = .25; ctx.drawImage(tinted(spr, 'rgba(128,88,162,.85)'), px - 14, py); ctx.globalAlpha = .45; ctx.drawImage(TMP, px - 7, py); ctx.globalAlpha = 1;
      ctx.drawImage(spr, px, py); ctx.drawImage(tinted(spr, col), px, py);
    } else { if (graceT > 0 && state === 'play' && Math.floor(clock*16) % 2) ctx.globalAlpha = .4; ctx.drawImage(spr, px, py); ctx.globalAlpha = 1; }
    const blink = P.sockT > 0 && P.sockT < 1.6 && Math.floor(clock*10)%2;
    if (P.sockT > 0 && !blink && state === 'play' && spr.ank){ const f = Math.floor(clock*14)%2; for (const a of spr.ank) ctx.drawImage(HEEL_WINGS[f], px + a[0] - 10, py + a[1] - 3 - f); }
    if (P.sink) ctx.restore();
  }

  for (const p of parts){ ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  for (const p of pops){ if (p.t > .6 && Math.floor(p.t*20)%2) continue; ptext(p.s, p.x, p.y - p.t*22, p.col); }
  if (flash > 0){ ctx.globalAlpha = Math.min(1, flash/.12)*.7; ctx.fillStyle = C.white; ctx.fillRect(-4,-4,W+8,H+8); ctx.globalAlpha = 1; }
  ctx.restore();
}

/* ================= Boucle ================= */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts; let dt = (ts - last)/1000; last = ts; if (dt > .05) dt = .05;
  if (state !== 'pause'){ const n = Math.max(1, Math.ceil(dt/.006)); for (let i=0;i<n;i++) update(dt/n); }
  draw();
}

/* ================= Responsive ================= */
function resize(){
  const vw = wrap.parentElement.clientWidth, vh = wrap.parentElement.clientHeight, a = vw/vh;
  wide = a >= 1.5;
  if (wide){ H = 200; W = Math.max(300, Math.min(460, Math.round(200*a))); GY = H - 36; }
  else { W = 300; H = Math.max(200, Math.min(640, Math.round(300/a))); GY = a >= 1 ? H - 36 : H - Math.max(36, Math.round(H*.42)); }
  FT = GY - 26;
  lay.ey = wide ? 86 : Math.round(Math.max(90, GY*.46));
  lay.ry = lay.ey + 40; lay.by = lay.ry + 21; lay.ly = wide ? GY + 7 : lay.by + 30; lay.py = wide ? 3 : Math.max(4, lay.ey - 104);
  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  const s = Math.min(vw/W, vh/H);
  wrap.style.width = Math.floor(W*s) + 'px'; wrap.style.height = Math.floor(H*s) + 'px';
  const rs = document.documentElement.style;
  rs.setProperty('--s', s.toFixed(3)); rs.setProperty('--gy', GY);
  rs.setProperty('--py', lay.py); rs.setProperty('--ry', lay.ry); rs.setProperty('--by', lay.by); rs.setProperty('--ly', lay.ly);
  buildThemes(); RAYS = null;
  if (state === 'title' || P.ground) P.y = GY;
  obs.length = 0; discs.length = 0; items.length = 0;
}

/* ================= Icônes ================= */
function icon(id, img){ const c = $(id); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); }
icon('icoDisc', DISC); icon('icoCount', DISC); icon('icoSock', SOCK[0]); icon('icoCone', CONES[0]);
icon('icoFire', mk(28, 24, g => { g.drawImage(FLAMES[0], 1, 0); g.drawImage(FDISC, 0, 11); }));

/* ================= Contrôles ================= */
function press(){
  ensureAudio();
  if (state === 'title'){ startGame(); return; }
  if (state === 'over'){ if (overT > .7) startGame(); return; }
  if (state === 'pause'){ resume(); return; }
  P.hold = true; P.buf = .13;
}
function release(){ P.hold = false; }
function pause(){ if (state !== 'play') return; state = 'pause'; ui.pause.hidden = false; P.hold = false; }
function resume(){ state = 'play'; ui.pause.hidden = true; last = 0; }

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'Escape' || e.code === 'KeyP'){ state === 'pause' ? resume() : pause(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });
wrap.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; e.preventDefault(); press(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);
$('start').addEventListener('click', e => { e.stopPropagation(); startGame(); });
$('again').addEventListener('click', e => { e.stopPropagation(); startGame(); });
$('home').addEventListener('click', e => { e.stopPropagation(); goHome(); });
$('resume').addEventListener('click', e => { e.stopPropagation(); resume(); });
function setMute(m){ muted = m; ui.mute.textContent = m ? 'Muet' : 'Son'; ui.mute.setAttribute('aria-label', m ? 'Activer le son' : 'Couper le son'); try { localStorage.setItem('stellyrun_muted', m ? '1' : '0'); } catch(e){} }
ui.mute.addEventListener('click', e => { e.stopPropagation(); ensureAudio(); setMute(!muted); ui.mute.blur(); });
setMute(muted); showTitleRecord();
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause);
addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);

})();
</script>
<script>
/* ================= PWA ================= */
(() => {
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const btn = document.getElementById('install');
  const standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone) btn.hidden = false; });
  addEventListener('appinstalled', () => { btn.hidden = true; deferred = null; });
  if (ios && !standalone) btn.hidden = false;
  btn.addEventListener('click', async e => {
    e.stopPropagation();
    if (deferred){ deferred.prompt(); try { await deferred.userChoice; } catch(_){} deferred = null; btn.hidden = true; }
    else if (ios){ const t = document.getElementById('toast'); t.textContent = 'Partager puis « Sur l’écran d’accueil »'; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
  });
  // en portrait sur téléphone : pause automatique
  const mq = matchMedia('(orientation: portrait) and (pointer: coarse)');
  const onOri = () => { if (mq.matches) dispatchEvent(new Event('blur')); };
  (mq.addEventListener ? mq.addEventListener('change', onOri) : mq.addListener(onOri));
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch(_){}
})();
</script>

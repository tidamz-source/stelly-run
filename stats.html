<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stelly Run · Stats mondiales</title>
<meta name="theme-color" content="#2E0E30">
<meta name="description" content="Les statistiques de tous les joueurs de Stelly Run">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2E0E30; --plum2:#3B1A40; --plum3:#5C3D63; --line:rgba(166,139,224,.22); --yellow:#FFCF00; --yellow-l:#FFE777; --orange:#F29318; --orange-d:#C9690E;
  --purple:#6E46A8; --purple-l:#A68BE0; --cream:#FFF4D6; --cream-d:#EBD8A6; --white:#FFFFFF; --red:#E0413A;
  --title:'Outfit', system-ui, sans-serif; --text:'Inter', system-ui, sans-serif;
}
*{ box-sizing:border-box; }
html{ background:var(--plum); }
body{ margin:0; min-height:100vh; color:var(--white); font-family:var(--text); font-size:15px; line-height:1.45;
  background:radial-gradient(1200px 600px at 85% -10%, rgba(110,70,168,.35), transparent 60%), var(--plum);
  padding:max(env(safe-area-inset-top), 28px) 20px max(env(safe-area-inset-bottom), 40px); -webkit-font-smoothing:antialiased; }
.wrap{ max-width:1120px; margin:0 auto; }
header{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 24px; margin-bottom:28px; }
h1{ margin:0; font-family:var(--title); font-weight:800; font-size:clamp(34px, 6vw, 56px); line-height:1; letter-spacing:-.02em; color:var(--yellow); }
h1 small{ display:block; margin-top:10px; font-family:var(--text); font-weight:500; font-size:clamp(15px, 2vw, 18px); letter-spacing:0; color:var(--purple-l); }
.meta{ font-size:13px; line-height:1.6; color:var(--purple-l); text-align:right; }
.langs{ display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
.langs button{ font:600 12px var(--text); color:var(--purple-l); background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 11px; cursor:pointer; }
.langs button.on{ background:var(--yellow); border-color:var(--yellow); color:var(--plum); }
h2{ margin:44px 0 16px; font-family:var(--title); font-weight:700; font-size:clamp(20px, 3vw, 26px); letter-spacing:-.01em; color:var(--white); display:flex; align-items:center; gap:10px; }
h2::before{ content:''; width:6px; height:22px; border-radius:3px; background:var(--yellow); }
.hero{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:16px; }
.big{ background:var(--cream); color:var(--plum); border-radius:16px; padding:22px 22px 20px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
.big b{ display:block; font-family:var(--title); font-weight:800; font-size:clamp(30px, 4.5vw, 44px); line-height:1.05; letter-spacing:-.02em; color:var(--orange-d); font-variant-numeric:tabular-nums; }
.big span{ display:block; margin-top:6px; font-weight:600; font-size:15px; color:var(--plum3); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
.tile{ background:var(--plum2); border:1px solid var(--line); border-radius:12px; padding:14px 14px 13px; }
.tile b{ display:block; font-family:var(--title); font-weight:700; font-size:24px; line-height:1.15; color:var(--white); font-variant-numeric:tabular-nums; }
.tile span{ display:block; margin-top:4px; font-size:13px; font-weight:500; color:var(--purple-l); }
.cols{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:16px; }
@media (max-width:760px){ .cols{ grid-template-columns:1fr; } }
.card{ background:var(--cream); color:var(--plum); border-radius:16px; padding:18px 20px 20px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
.card h3{ margin:0 0 6px; font-family:var(--title); font-size:18px; font-weight:700; }
.bar{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; margin:10px 0 0; font-weight:600; font-size:14px; }
.bar em{ font-style:normal; font-weight:700; font-variant-numeric:tabular-nums; color:var(--plum3); }
.bar i{ grid-column:1 / -1; height:8px; border-radius:999px; background:linear-gradient(90deg, var(--orange), var(--yellow)); }
.fatal{ margin-top:16px; padding-top:12px; border-top:1px solid var(--cream-d); font-weight:500; font-size:14px; color:var(--plum3); }
.fatal b{ color:#C0392B; font-weight:700; }
.fame{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
.fcard{ background:var(--plum2); border:1px solid var(--line); border-radius:16px; padding:16px 16px 12px; }
.fcard h3{ margin:0; font-family:var(--title); font-size:19px; font-weight:700; color:var(--yellow); }
.fcard p{ margin:2px 0 12px; font-size:13px; color:var(--purple-l); }
.fcard ol{ list-style:none; margin:0; padding:0; }
.fcard li{ display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:10px; padding:7px 8px; border-radius:10px; font-weight:600; font-size:14px; }
.fcard li:first-child{ background:rgba(255,207,0,.12); }
.fcard li .rk{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:12px; font-weight:700; background:var(--plum3); color:var(--white); }
.fcard li:nth-child(1) .rk{ background:var(--yellow); color:var(--plum); }
.fcard li:nth-child(2) .rk{ background:#D7DCE3; color:var(--plum); }
.fcard li:nth-child(3) .rk{ background:#D08A4E; color:var(--plum); }
.fcard li .nm{ letter-spacing:.06em; }
.fcard li .v{ font-family:var(--title); font-weight:700; color:var(--yellow-l); font-variant-numeric:tabular-nums; }
.empty{ color:var(--purple-l); font-size:14px; padding:6px 2px; }
.msg{ margin:80px auto; max-width:520px; text-align:center; font-size:17px; color:var(--purple-l); }
footer{ margin-top:48px; text-align:center; font-size:13px; color:var(--purple-l); }
footer a{ color:var(--yellow); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stelly Run<small id="sub">Stats mondiales</small></h1>
    <div><div class="langs" id="langs"></div><div class="meta" id="meta"></div></div>
  </header>
  <main id="main"><p class="msg" id="loading">…</p></main>
  <footer><a href="./" id="play">Jouer à Stelly Run</a> · © Lutèce Games</footer>
</div>
<script>
// si la page est ouverte dans l'appli Stelly Run installée (ancienne version de l'appli sur Android), on libère l'orientation
(() => { try { if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches && screen.orientation && screen.orientation.lock)
  screen.orientation.lock('any').catch(() => {}); } catch(e){} })();
</script>
<script src="langues.js?v=5.89"></script>
<script>
(() => {
const LB_URL = 'https://script.google.com/macros/s/AKfycbwJCiKyJ7zyoGK7BEGem0crHldaZgvWSWcj6KE-rIQQlqkaoltC68gVqk7Hz5O8U0W6jQ/exec';
const PAGE = {
  sub:{ fr:'Stats mondiales', en:'World stats', es:'Estadísticas mundiales' },
  players:{ fr:'{n} joueurs', en:'{n} players', es:'{n} jugadores' },
  updated:{ fr:'mis à jour à {t}', en:'updated at {t}', es:'actualizado a las {t}' },
  play:{ fr:'Jouer à Stelly Run', en:'Play Stelly Run', es:'Jugar a Stelly Run' },
  loading:{ fr:'Chargement des stats…', en:'Loading stats…', es:'Cargando estadísticas…' },
  error:{ fr:'Stats indisponibles pour le moment. Réessaie dans un instant.', en:'Stats unavailable right now. Try again in a moment.', es:'Estadísticas no disponibles por ahora. Inténtalo de nuevo en un momento.' },
  empty:{ fr:'Aucune stat pour l’instant : joue une partie pour lancer le compteur !', en:'No stats yet: play a game to get things started!', es:'Aún no hay estadísticas: ¡juega una partida para empezar!' },
  all:{ fr:'Tous les compteurs', en:'All counters', es:'Todos los contadores' },
  deaths:{ fr:'Morts par cause', en:'Deaths by cause', es:'Muertes por causa' },
  deathsSec:{ fr:'Le cimetière', en:'The graveyard', es:'El cementerio' },
  terrains:{ fr:'Morts par terrain', en:'Deaths by terrain', es:'Muertes por terreno' },
  fame:{ fr:'Hall of Fame', en:'Hall of Fame', es:'Salón de la fama' },
  nobody:{ fr:'Personne pour l’instant', en:'Nobody yet', es:'Nadie por ahora' },
  totalDeaths:{ fr:'morts au total', en:'deaths in total', es:'muertes en total' }
};
const FAME = [
  ['score', { fr:'Meilleurs scores', en:'Top scores', es:'Mejores puntuaciones' }, { fr:'record personnel', en:'personal best', es:'récord personal' }],
  ['streak', { fr:'Mains d’or', en:'Golden Hands', es:'Manos de oro' }, { fr:'plus longue série de frisbees', en:'longest frisbee streak', es:'racha de frisbees más larga' }],
  ['discs', { fr:'Aspirateur à frisbees', en:'Frisbee Vacuum', es:'Aspiradora de frisbees' }, { fr:'frisbees attrapés', en:'frisbees caught', es:'frisbees atrapados' }],
  ['games', { fr:'Accro', en:'Hooked', es:'Enganchado' }, { fr:'parties jouées', en:'games played', es:'partidas jugadas' }],
  ['dist', { fr:'Marathonien', en:'Marathon Runner', es:'Maratonista' }, { fr:'distance parcourue', en:'distance run', es:'distancia recorrida' }],
  ['ko', { fr:'Chasseur d’oiseaux', en:'Bird Hunter', es:'Cazador de pájaros' }, { fr:'oiseaux assommés', en:'birds knocked out', es:'pájaros noqueados' }],
  ['morts', { fr:'Cascadeur', en:'Stunt Double', es:'Doble de riesgo' }, { fr:'morts', en:'deaths', es:'muertes' }],
  ['missed', { fr:'Mains en beurre', en:'Butterfingers', es:'Manos de mantequilla' }, { fr:'frisbees ratés', en:'frisbees missed', es:'frisbees fallados' }],
  ['spent', { fr:'Fashion addict', en:'Fashion Addict', es:'Adicto a la moda' }, { fr:'dépensés en boutique', en:'spent in the shop', es:'gastados en la tienda' }],
  ['rb', { fr:'Chasseur d’arc-en-ciel', en:'Rainbow Hunter', es:'Cazador de arcoíris' }, { fr:'frisbees arc-en-ciel', en:'rainbow frisbees', es:'frisbees arcoíris' }],
  ['sharks', { fr:'Ami des requins', en:'Shark Buddy', es:'Amigo de los tiburones' }, { fr:'sauts de requin vus', en:'shark jumps seen', es:'saltos de tiburón vistos' }],
  ['giga', { fr:'Giga-joueur', en:'Giga Player', es:'Giga jugador' }, { fr:'giga combos', en:'giga combos', es:'giga combos' }]
];
const TILES = [['games','stats.games'],['discs','stats.discs'],['rb','stats.rainbow'],['spent','stats.spent'],['ko','stats.ko'],['doe','stats.deer'],['sharks','stats.sharks'],['dist','stats.dist'],
  ['missed','stats.missed'],['fires','stats.fires'],['socks','stats.socks'],['slows','stats.slows'],['combo','stats.combo'],['superC','stats.superC'],['mega','stats.mega'],['giga','stats.giga']];
const THEMES = ['Outdoor', 'Indoor', 'Beach', 'Catch La Peuf', 'City', 'Forest', 'Fields'];
let LANG = (() => { try { const l = localStorage.getItem('stellyrun_lang'); if (l && LANGS[l]) return l; } catch(e){} const n = (navigator.language || 'fr').slice(0, 2); return LANGS[n] ? n : 'fr'; })();
const pick = o => (o && (o[LANG] != null ? o[LANG] : o.fr)) || '';
const T = (k, v) => { let s = PAGE[k] ? pick(PAGE[k]) : (TEXTS[k] ? pick(TEXTS[k]) : k); if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; };
const fmt = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, { fr:'\u202F', es:'.' }[LANG] || ',');
const km = px => { const m = (px || 0)/30; return m >= 10000 ? (Math.round(m/100)/10).toLocaleString({ fr:'fr-FR', es:'es-ES' }[LANG] || 'en-US') + ' km' : fmt(m) + ' m'; };
const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
let data = null;
function render(){
  document.documentElement.lang = LANG;
  $('sub').textContent = T('sub'); $('play').textContent = T('play'); document.title = 'Stelly Run · ' + T('sub');
  $('langs').innerHTML = Object.keys(LANGS).map(l => '<button data-l="' + l + '"' + (l === LANG ? ' class="on"' : '') + '>' + l.toUpperCase() + '</button>').join('');
  const main = $('main');
  if (!data){ main.innerHTML = '<p class="msg">' + esc(T('loading')) + '</p>'; return; }
  if (!data.ok){ main.innerHTML = '<p class="msg">' + esc(T('error')) + '</p>'; return; }
  const t = data.totals || {};
  $('meta').innerHTML = esc(T('players', { n: fmt(data.players) })) + '<br>' + esc(T('updated', { t: new Date(data.updated).toLocaleTimeString({ fr:'fr-FR', es:'es-ES' }[LANG] || 'en-GB', { hour:'2-digit', minute:'2-digit' }) }));
  if (!data.players){ main.innerHTML = '<p class="msg">' + esc(T('empty')) + '</p>'; return; }
  let h = '<section class="hero">'
    + '<div class="big"><b>' + fmt(t.games) + '</b><span>' + esc(T('stats.games')) + '</span></div>'
    + '<div class="big"><b>' + fmt(t.discs) + '</b><span>' + esc(T('stats.discs')) + '</span></div>'
    + '<div class="big"><b>' + km(t.dist) + '</b><span>' + esc(T('stats.dist')) + '</span></div></section>';
  h += '<h2>' + esc(T('all')) + '</h2><section class="grid">' + TILES.map(([k, lab]) => {
    const v = k === 'doe' ? fmt(t.doe) + ' / ' + fmt(t.stag) : (k === 'dist' ? km(t.dist) : fmt(t[k]));
    return '<div class="tile"><b>' + v + '</b><span>' + esc(T(lab)) + '</span></div>'; }).join('') + '</section>';
  const bars = (obj, label) => { const e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]); if (!e.length) return '<div class="empty">' + esc(T('nobody')) + '</div>';
    const mx = e[0][1]; return e.map(([k, n]) => '<div class="bar"><span>' + esc(label(k)) + '</span><em>' + fmt(n) + '</em><i style="width:' + Math.max(4, n/mx*100) + '%"></i></div>').join(''); };
  const th = Object.entries(data.deathTh || {}).sort((a, b) => b[1] - a[1])[0];
  h += '<h2>' + esc(T('deathsSec')) + '</h2><section class="cols">'
    + '<div class="card"><h3>' + esc(T('deaths')) + '</h3>' + bars(data.deathBy, k => TEXTS['cause.' + k] ? T('cause.' + k) : k)
    + '<div class="fatal">' + fmt(t.morts) + ' ' + esc(T('totalDeaths')) + (th ? ' · ' + esc(T('stats.fatal')) + ' <b>' + esc(THEMES[th[0]] || '') + '</b>' : '') + '</div></div>'
    + '<div class="card"><h3>' + esc(T('terrains')) + '</h3>' + bars(data.deathTh, k => THEMES[k] || k) + '</div></section>';
  h += '<h2>' + esc(T('fame')) + '</h2><section class="fame">' + FAME.map(([k, title, what]) => {
    const list = (data.leaders || {})[k] || [];
    return '<div class="fcard"><h3>' + esc(pick(title)) + '</h3><p>' + esc(pick(what)) + '</p>'
      + (list.length ? '<ol>' + list.map((p, i) => '<li><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(p.name || '???') + '</span><span class="v">' + (k === 'dist' ? km(p.v) : fmt(p.v)) + '</span></li>').join('') + '</ol>' : '<div class="empty">' + esc(T('nobody')) + '</div>')
      + '</div>'; }).join('') + '</section>';
  main.innerHTML = h;
}
function $(id){ return document.getElementById(id); }
document.addEventListener('click', e => { const b = e.target.closest('#langs button'); if (b){ LANG = b.dataset.l; try { localStorage.setItem('stellyrun_lang', LANG); } catch(err){} render(); } });
async function load(){
  try { const r = await fetch(LB_URL + '?action=global', { cache:'no-store' }); data = await r.json(); } catch(e){ if (!data) data = { ok:false }; }
  render();
}
render(); load(); setInterval(load, 120000);
})();
</script>
</body>
</html>
